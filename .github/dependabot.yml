# Dependabot version updates for the flake inputs and the pinned CI actions.
#
# npm dependencies are deliberately NOT listed here. The lockfile is the project's
# own and is updated by whoever is changing the application; a weekly bot opening
# pull requests against it would compete with that work for review attention. The
# Nix side is the part that goes quietly stale, because nothing in the day-to-day
# workflow touches flake.lock, so that is what is scheduled here.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # nix flake inputs: flake.nix and flake.lock
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group all input bumps into one pull request per week, so a routine refresh
    # costs one review rather than one per input.
    groups:
      flake-inputs:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions, including the version-pinned actions in the check workflow.
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
